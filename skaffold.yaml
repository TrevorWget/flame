apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: flame
build:
  # The default git describe tag would pick up the backup/* tags
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
  local:
    useBuildkit: true
  artifacts:
    - image: ghcr.io/trevorwget/flame
      context: .
      docker:
        dockerfile: .docker/Dockerfile
manifests:
  kustomize:
    paths:
      - k8s/base
deploy:
  kubectl: {}
profiles:
  # `skaffold dev`: server code is synced into the container and nodemon restarts it;
  # other changes (client, package.json) rebuild the image
  - name: dev
    activation:
      - command: dev
    build:
      local:
        useBuildkit: true
      artifacts:
        - image: ghcr.io/trevorwget/flame
          context: .
          docker:
            dockerfile: .docker/Dockerfile.dev
          sync:
            manual:
              - src: '*.js'
                dest: .
              - src: 'controllers/**/*.js'
                dest: .
              - src: 'db/**/*.js'
                dest: .
              - src: 'middleware/**/*.js'
                dest: .
              - src: 'models/**/*.js'
                dest: .
              - src: 'routes/**/*.js'
                dest: .
              - src: 'utils/**/*.js'
                dest: .
              - src: 'validation/**/*.js'
                dest: .
