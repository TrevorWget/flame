name: Docker image

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/trevorwget/flame
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/Dockerfile
          load: true
          tags: flame:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name flame -p 5005:5005 \
            -v "$RUNNER_TEMP/data:/app/data" \
            -e PASSWORD=smoke-test-password \
            flame:smoke-test

          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' flame)"
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' flame)" = true ] || break
            sleep 3
          done

          docker logs flame
          [ "$status" = healthy ] || { echo "::error::container did not become healthy ($status)"; exit 1; }

      - name: Check runtime user and data files
        run: |
          [ "$(docker exec flame id -u)" = 1000 ] || { echo "::error::container is not running as uid 1000"; exit 1; }
          curl -fsS http://127.0.0.1:5005/api/config > /dev/null
          ls -lan "$RUNNER_TEMP/data"
          [ -f "$RUNNER_TEMP/data/db.sqlite" ] && [ -f "$RUNNER_TEMP/data/config.json" ]

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=Flame
            org.opencontainers.image.description=Self-hosted start page for your server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
