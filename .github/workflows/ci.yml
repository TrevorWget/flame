name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

# Branches in this repo are already checked on push; pull_request runs are
# only needed for PRs from forks.
jobs:
  server:
    name: Server (lint, tests)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  client:
    name: Client (lint, typecheck, build)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Existing warnings are reported but only errors fail the job
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # With CI=true, react-scripts' built-in ESLint turns warnings into build
      # errors; the Lint step above already covers ESLint
      - name: Build
        run: npm run build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

  audit:
    name: npm audit (production deps)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fails on high/critical advisories outside the documented ignored roots
      # in .github/scripts/audit-gate.js
      - name: Server
        if: ${{ !cancelled() }}
        run: node .github/scripts/audit-gate.js server

      - name: Client
        if: ${{ !cancelled() }}
        run: node .github/scripts/audit-gate.js client
