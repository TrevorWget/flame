services:
  flame:
    image: ghcr.io/trevorwget/flame:latest
    container_name: flame
    volumes:
      - /path/to/host/data:/app/data # must be writable by uid 1000 (or see `user` below)
      # - /var/run/docker.sock:/var/run/docker.sock # optional but required for Docker integration
    # group_add:
    #   - "999" # required with the Docker socket: its group id, from `stat -c %g /var/run/docker.sock`
    # user: "1001:1001" # optional: run as another uid:gid that owns the data directory
    ports:
      - 5005:5005
    # secrets:
    #   - password # optional but required for (1)
    environment:
      - PASSWORD= # required: set a strong password, login is disabled until you do
      # - PASSWORD_FILE=/run/secrets/password # optional but required for (1)
    restart: unless-stopped

# optional but required for Docker secrets (1)
# secrets:
#   password:
#     file: /path/to/secrets/password
